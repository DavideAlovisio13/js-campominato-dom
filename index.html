<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Campo Minato in JavaScript puro: tre livelli di difficoltà, 16 bombe, conteggio delle bombe adiacenti.">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" href="img/bomb.svg" type="image/svg+xml">
    <link rel="stylesheet" href="css/style.css">
    <title>Campo Minato</title>
    <script src="js/script.js" defer></script>
</head>

<body>
    <header class="topbar">
        <h1 class="brand"><img src="img/bomb.svg" alt="" width="28" height="28"> Campo Minato</h1>
        <form class="controls" id="controls">
            <label class="sr-only" for="difficulty">Difficoltà</label>
            <select id="difficulty" name="difficulty">
                <option value="100">Livello 1 · 10×10</option>
                <option value="81">Livello 2 · 9×9</option>
                <option value="49">Livello 3 · 7×7</option>
            </select>
            <button type="submit" class="btn">Nuova partita</button>
        </form>
    </header>

    <main class="board-wrap">
        <div class="hud" aria-live="polite">
            <span>Punteggio <strong id="score">0</strong></span>
            <span>Celle sicure <strong id="left">0</strong></span>
            <span>Bombe <strong id="bombs">16</strong></span>
        </div>
        <div class="board" id="board" role="grid" aria-label="Campo di gioco"></div>
        <p class="message" id="message" role="status">Scegli un livello e premi «Nuova partita».</p>
    </main>

    <footer class="footer">
        Progetto del corso Full-Stack di Boolean · rivisto nel 2026
    </footer>
</body>

</html>
